[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chipchat"
version = "0.1.0"
description = "Per-device I/O monitor showing meters for disks and network interfaces"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "pyyaml",
    "rich==14.2.0",
]

[project.scripts]
chipchat = "chipchat:main"

[tool.setuptools]
py-modules = ["chipchat"]
